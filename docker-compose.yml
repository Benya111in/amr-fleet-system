# 지능형 물류 AMR 시스템 - 개발/실행 환경
#
#   docker compose build          이미지 빌드
#   docker compose up -d dev      개발 컨테이너 기동
#   docker compose exec dev bash  셸 접속
#
# 서비스는 동일 이미지를 공유하며 network_mode: host 로 ROS2 DDS 디스커버리를 사용한다.

x-amr-common: &amr-common
  image: amr-fleet-system:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &amr-env
    - DISPLAY=${DISPLAY:-}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    # headless GPU 렌더링 (호스트에 DISPLAY 없이 Gazebo 센서 렌더링)
    - __GLX_VENDOR_LIBRARY_NAME=nvidia
  volumes: &amr-volumes
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ./src:/ros2_ws/src
    - ./scripts:/ros2_ws/scripts
    - ./config:/ros2_ws/config
    - ./maps:/ros2_ws/maps
    - ./logs:/ros2_ws/logs
    - ./docs:/ros2_ws/docs
    - ./tests:/ros2_ws/tests
  network_mode: host
  ipc: host
  privileged: true
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, compute, utility, graphics]

services:
  # 개발용 상시 컨테이너 — 빌드/디버깅/수동 실행
  dev:
    <<: *amr-common
    container_name: amr_dev
    stdin_open: true
    tty: true
    command: bash

  # Gazebo Fortress 시뮬레이션 (물류센터 60m x 40m)
  simulation:
    <<: *amr-common
    container_name: amr_simulation
    profiles: ["run"]
    command: >
      bash -c "ros2 launch amr_simulation warehouse.launch.py"

  # SLAM / 위치 추정 (slam_toolbox + EKF 센서 퓨전)
  localization:
    <<: *amr-common
    container_name: amr_localization
    profiles: ["run"]
    depends_on: [simulation]
    command: >
      bash -c "ros2 launch amr_localization localization.launch.py"

  # Nav2 + 직접 구현 A*/DWA 플래너
  navigation:
    <<: *amr-common
    container_name: amr_navigation
    profiles: ["run"]
    depends_on: [localization]
    command: >
      bash -c "ros2 launch amr_navigation navigation.launch.py"

  # YOLOv8 객체 인식 + 2D→3D 좌표 변환 (GPU)
  perception:
    <<: *amr-common
    container_name: amr_perception
    profiles: ["run"]
    depends_on: [simulation]
    command: >
      bash -c "ros2 launch amr_perception perception.launch.py"

  # Fleet Management (5대 이상 AMR 할당/교착 해소)
  fleet:
    <<: *amr-common
    container_name: amr_fleet
    profiles: ["run"]
    depends_on: [navigation]
    command: >
      bash -c "ros2 launch amr_fleet fleet_manager.launch.py"

  # 웹 모니터링 대시보드
  dashboard:
    <<: *amr-common
    container_name: amr_dashboard
    profiles: ["run"]
    depends_on: [fleet]
    command: >
      bash -c "ros2 launch amr_dashboard dashboard.launch.py"
