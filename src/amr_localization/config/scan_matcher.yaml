# scan_matcher_node 파라미터 (명세 4.3 "위치 추정 오차 정지 3 cm / 직선 5 cm / 회전 8 cm")
# 스캔 → 정적 지도 띠 중심선 점-대-면 Gauss–Newton 정합 → map EKF pose1 (config/ekf.yaml).
# 식·유도·측정: docs/algorithms/slam.md §4.3, ekf.md §3. 코어: amr_localization/scan_registration.py
# [공유] range_noise, lidar_offset 은 localization.launch.py 가 config/sensors.yaml lidar.* 에서 덮어쓴다.
/**/scan_matcher_node:
  ros__parameters:
    # --- 지도 면 (맵당 1 회) ---
    centroid_radius: 0.12         # [m] 띠 중심선 = 관측면 셀 주변 이 반지름 안 점유 셀 중심 평균 (띠 2.8~3.2 셀 = 0.15 m
                                  #   를 덮는 반지름; 더 크면 모서리가 둥글어진다)
    normal_radius: 0.20           # [m] 법선 PCA 이웃 (띠 폭의 ~1.3 배: 두께 방향과 면 방향 고유값이 확실히 갈림)
    min_planarity: 3.0            # λ_max/λ_min 미만(모서리·기둥 끝·작은 물체)은 점-대-점 잔차
    surface_offset: 0.0           # [m] 면 점을 자유 공간 쪽으로 옮김 (띠 중심 ≠ 실제 면 규약 보정 자리; 0 = 보정 안 함)

    # --- 정합 ---
    max_beams: 360                # 720 빔 중 1° 간격 (180 이면 통로 벽 구속이 약해지고, 720 은 CPU 두 배)
    max_rate: 10.0                # [Hz] 스캔 처리 상한 (LiDAR 10 Hz 전부)
    max_correspondence: 0.25      # [m] 대응 거리 상한: 초기 추정(EKF) 오차 수 cm ≪ 0.25, 지도에 없는 사람·지게차 빔은 버림
    range_noise: 0.03             # [m] σ_r (sensors.yaml lidar.noise_stddev) — Huber 척도
    huber_k: 2.0                  # Huber 문턱 = 2σ_r = 6 cm
    max_iterations: 15
    converge_translation: 0.0001  # [m] 잘 구속된 방향 잔차 RMS 변화 문턱
    converge_rotation: 0.00001    # [rad]
    min_inlier_ratio: 0.6         # 유효 빔 중 대응을 찾은 비율 하한 (낮으면 지도와 다른 곳 → 측정 없음)
    min_points: 60
    max_correction: 0.3           # [m] EKF 초기 추정에서 이보다 멀리 가면 실패 (다른 분지·납치)
    max_rotation_correction: 0.1  # [rad]

    # --- 공분산 Σ = κ s² (JᵀWJ)⁻¹ + 하한 ---
    covariance_scale: 10.0        # κ: 빔 잔차가 지도 격자·띠 모양을 공유해 상관 → 헤시안 역(독립 가정)은 과신.
                                  #   합성 시험(독립 잡음)에서 κ = 1 이 실제 분산과 맞고, Gazebo 에서는 정지 오차 분산이
                                  #   헤시안 역의 ~10 배 (slam.md §6.3) → 10
    min_sigma_xy: 0.005           # [m] 하한 (지도 해상도 0.05 m 의 1/10)
    min_sigma_yaw: 0.002          # [rad] 하한 (0.11°)

    # --- 인터페이스 ---
    scan_topic: scan_filtered
    map_topic: /map
    output_topic: scan_match_pose
    lost_topic: localization/lost # 위치 상실(납치 복구) 중에는 측정을 내지 않는다
    map_frame: map
    base_frame: base_footprint    # launch 가 <prefix>base_footprint 로 덮어씀
    lidar_offset: [0.15, 0.0, 0.0]  # [m, m, rad] base_footprint→lidar_link 2D (launch 가 sensors.yaml extrinsic 으로 덮어씀)
    tf_timeout: 0.05              # [s] 스캔 시각 map→base TF 대기 (초기 추정)
    max_tf_age: 0.5               # [s] 스캔 시각 TF 가 없으면 최근 TF 로 대신 (이만큼 이내일 때): 초기 추정은 정합
                                  #     분지 안이면 되고 결과는 스캔 끝점이 정한다 (고부하 RTF 0.2 에서 EKF TF 지연)
    occupied_thresh: 65
    stats_log_period: 30.0        # [s] 성공/거부 수·잔차·보정량·처리 시간 로그 (0 = 끔)
