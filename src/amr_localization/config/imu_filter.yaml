# imu_filter_node 파라미터 (명세 4.2 "IMU 저역 통과 필터 + 바이어스 보정")
# 알고리즘: docs/algorithms/kinematics.md §5, 절차: docs/architecture/sensor_calibration.md §2.4
# [공유] 값은 localization.launch.py 가 config/sensors.yaml imu.* 에서 덮어쓴다.
/**/imu_filter_node:
  ros__parameters:
    # --- 저역 통과 (1차 IIR, 정확한 −3 dB 설계) ---
    lpf_cutoff_hz: 20.0           # [Hz] f_c. 100 Hz 샘플에서 α = 0.673, 잡음 σ × 0.71, 군지연 ≈ 5 ms.
                                  #   로봇 동역학 대역(가속 1 m/s², 저크 2 m/s³ → 수 Hz)보다 충분히 높아 EKF 지연을
                                  #   만들지 않으면서 고주파 잡음·진동을 줄인다. 10 Hz 는 지연 12 ms (0 이하 = 끔)

    # --- 바이어스 ---
    bias_estimation_time: 60.0    # [s] 기동 직후 정지 평균 시간. 표준오차 gyro 2.6e-6 rad/s, accel 2.2e-4 m/s²
                                  #   (σ/√6000). 0 = 추정 안 함(아래 파일 값 사용). 도중에 움직이면 그때까지 평균 사용
    min_startup_samples: 20       # 이 수만큼 모이기 전에는 발행하지 않음 (0.2 s @100 Hz)
    gyro_bias: [0.0, 0.0, 0.0]    # [rad/s] 초기/파일 값 (imu/calibrate 결과 YAML 로 덮어쓰기)
    accel_bias: [0.0, 0.0, 0.0]   # [m/s²] 중력 제외 오프셋
    gravity: 9.8                  # [m/s²] 월드 <gravity> 크기. 가속도 바이어스 = mean(a) − (0, 0, g)
    stationary_gyro_std_max: 0.01 # [rad/s] 정지 판정: 자이로 표본 σ 상한 (잡음 2e-4 의 50 배 — 진동 여유)
    stationary_accel_std_max: 0.2 # [m/s²] 가속도 표본 σ 상한 (잡음 0.017 의 ~12 배)
    accel_norm_tolerance: 0.5     # [m/s²] |mean a| 가 g ± 이 값 밖이면 정지 아님 (기울어짐·가속)
    calibration_samples: 1000     # imu/calibrate 서비스가 평균하는 샘플 수 (10 s @100 Hz)
    calibration_timeout: 0.0      # [s] 0 = 3 × 샘플수/100 Hz + 5 s (ROS 시각 기준)
    calibration_dir: ''           # '' = $ROS_WS/logs/calibration (imu_bias_<robot>_<시각>.yaml + imu_bias.csv)
    max_gap: 0.5                  # [s] 샘플 공백이 이보다 길면 LPF 상태 재시작

    # --- 공분산 [공유: sensors.yaml imu.*_noise_stddev] ---
    gyro_noise_stddev: 0.0002     # [rad/s] σ_g → angular_velocity_covariance = σ_g² + SE_g²
    accel_noise_stddev: 0.017     # [m/s²] σ_a → linear_acceleration_covariance = σ_a² + SE_a²
    frame_id: ''                  # '' = 입력 header.frame_id 유지 (Gazebo 가 <prefix>imu_link 를 넣는다)
