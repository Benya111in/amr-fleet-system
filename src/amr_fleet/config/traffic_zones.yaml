# 교통 구역 · 대기 포켓 (map 프레임 [m], 원점 = 창고 중심). traffic_manager_node 가 읽는다.
# 유도 근거: feature/simulation-world 의 src/amr_simulation/worlds/gen_warehouse_world.py 상수
#   랙 2.0 x 1.0 m, 열 A/B/C 의 y = 9 / 3 / -3, 베이 x = -18 .. 18 (6 m 간격) → 이웃 랙 사이 틈 4 m
#   통로 AB y 3.5 ~ 8.5, BC y -2.5 ~ 2.5 (폭 5 m), 좁은 통로 (0, -10): 순폭 0.60 m, y -12 ~ -8
#   기둥 0.52 m (±10, ±12), (±25, ±6), 외벽 안쪽 면 x = ±29.8, y = ±19.8
# 구역
#   narrow_aisle        1차선 통로 (용량 1, 같은 방향 추종만 허용). 몸체 판정이 중심 + 외접 반경 네 점이라
#                       랙 사이 틈보다 넓게(x ±0.5) 잡는다
#   x_<통로>_<k>        통로 AB/BC 와 열 틈(k = 1..6, 서→동) 이 만나는 교차로 4 x 5 m (용량 1).
#                       통로 AB→틈→BC 처럼 1 m 틈을 사이에 둔 두 교차로는 chain_gap_m(1.5) 안이라
#                       한 번에 받는다 (틈에서 서지 않기). 교차로 사이 랙 앞 2 m 구간이 대기 자리다
#   메인 통로(y > 9.5) · 남쪽 홀(y < -3.5) 은 트인 공간이라 구역을 두지 않는다 (교차 예측 · 교착 탐지가 맡는다)
# 포켓 (전략 1 양보 목적지): 교차로 밖 랙 앞면에서 0.6 m (통로 중앙선에서 1.9 m — pocket_clearance_m 1.0 밖),
#   좁은 통로 양 끝 옆 (중앙선 x=0 에서 2.3 m), 북 · 남 벽 앞. 모두 장애물에서 외접 반경 0.36 m 이상
#   (test_traffic_zones.py 가 같은 상수로 그린 지도에서 확인한다)
frame_id: map
