# 교통 구역 · 대기 포켓 (map 프레임 [m], 원점 = 창고 중심). traffic_manager_node 가 읽는다.
# 유도 근거: feature/simulation-world 의 src/amr_simulation/worlds/gen_warehouse_world.py 상수
#   랙 2.0 x 1.0 m, 열 A/B/C 의 y = 9 / 3 / -3, 베이 x = -18 .. 18 (6 m 간격) → 이웃 랙 사이 틈 4 m
#   통로 AB y 3.5 ~ 8.5, BC y -2.5 ~ 2.5 (폭 5 m), 좁은 통로 (0, -10): 순폭 0.60 m, y -12 ~ -8
#   기둥 0.52 m (±10, ±12), (±25, ±6), 외벽 안쪽 면 x = ±29.8, y = ±19.8
# 구역
#   narrow_aisle        1차선 통로 (용량 1, 같은 방향 추종만 허용). 몸체 판정이 중심 + 외접 반경 네 점이라
#                       랙 사이 틈보다 넓게(x ±0.5) 잡는다. 입구 corridor_approach_m(2.5) 앞에서 요청 —
#                       남쪽 홀 한가운데라 다른 구역과 5 m 넘게 떨어져 있다
#   x_<통로>_<k>        통로 AB/BC 와 열 틈(k = 1..6, 서→동, 틈 중심 x = -15, -9, -3, 3, 9, 15)이 만나는
#                       교차로의 가운데 2 x 5 m (용량 1). 틈 폭 4 m 전체가 아니라 가운데 2 m 만 잡는다:
#                       - 통로를 따라 이웃 교차로 사이 간격 = 4 m ≥ approach_distance_m(1.5) + robot_radius(0.36)
#                         → 다음 교차로를 기다리는 자리(입구 0.9 ~ 1.5 m 앞, 랙 끝 근처)가 두 구역 밖이다.
#                         (틈 전체 4 m 로 잡으면 간격 2 m < 2.5 + 0.36 이라 앞 교차로 안에서 서서 토큰을 쥔 채
#                         기다렸다 — 반대 방향 두 로봇의 토큰 ↔ 토큰 교착, 리뷰 finding 1. 시작할 때
#                         spacing_conflicts 가 이런 쌍을 거절한다)
#                       - 통로 AB→틈→BC 처럼 1 m 틈을 사이에 둔 두 교차로는 chain_gap_m(1.5) 안이라 한 번에
#                         받는다 (틈에서 서지 않기)
#                       - 기다리는 자리가 랙 가운데 스테이션(x = 랙 중심)을 막지 않는다
#   메인 통로(y > 9.5) · 남쪽 홀(y < -3.5) 은 트인 공간이라 구역을 두지 않는다 (교차 예측 · 교착 탐지가 맡는다)
#   측정 (docs/algorithms/deadlock.md 8.2, 실제 창고 배치 5대 x 30시드): 이 배치가 교착 수 · makespan 에서
#   교통 관리 없음보다 나쁘지 않은 것을 확인했다 (교착 0 vs 2, 해소만 대비 makespan +1.6 %). x_* 를 모두 빼면(좁은 통로만)
#   이 시뮬레이터에서는 조금 더 짧다 (+1.0 %) — 8.2 배치 비교 표.
# 포켓 (전략 1 양보 목적지): 교차로 밖 랙 앞면에서 0.6 m (통로 중앙선에서 1.9 m — pocket_clearance_m 1.0 밖),
#   좁은 통로 양 끝 옆 (중앙선 x=0 에서 2.3 m), 북 · 남 벽 앞. 모두 장애물에서 외접 반경 0.36 m 이상
#   (test_traffic_zones.py 가 같은 상수로 그린 지도에서 확인한다)
