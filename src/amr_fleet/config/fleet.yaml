# amr_fleet 파라미터 (명세 4.8 작업 관리, 4.9 Fleet Management)
# launch/fleet_manager.launch.py 의 인자(robot_ids 와, 비어 있지 않은 allocation_strategy · comm_latency_ms ·
# simulate_latency · auto_complete_after_s · serve_assign_task · log_dir)만 이 파일 값을 덮어쓴다.
# [시작 전용] 표시가 없는 manager 파라미터는 실행 중 `ros2 param set` 으로 바꿀 수 있다.
# [시작 전용] 은 시작할 때 한 번 읽으므로 실행 중 변경을 거절한다 (노드 재시작 필요).

/fleet/fleet_manager_node:
  ros__parameters:
    robot_ids: ""                    # [시작 전용] "amr_01,amr_02" 또는 문자열 배열. 비우면 discover_robots 로만
                                     # 등록. 고정 지정(robot_id) 작업은 등록된 로봇만 받는다 (그 외 INVALID_TASK)
    discover_robots: true            # [시작 전용] /<id>/robot_state 토픽이 보이면 자동 등록
    allocation_strategy: nearest     # [시작 전용] nearest | load_balance | hungarian (allocation.py 레지스트리)
    allocation_batch_size: 0         # 한 라운드에 전략에 넘길 대기 작업 수. 0 = 가용 로봇 수
                                     # (바쁜 로봇에 고정된 작업은 빼고 채운다 → 빈 로봇이 놀지 않는다)
    nominal_speed: 1.0               # [시작 전용] [m/s] 이동 시간 = 거리 / nominal_speed (limits.max 2.0 의 절반)
    # 통신 지연 시뮬레이션 (multi_robot.md §6): assign_task 호출 전 송신 지연 큐
    simulate_latency: true           # [시작 전용] false = 지연·유실 없음 (실기 배포)
    comm_latency_ms: [0.0, 100.0]    # [시작 전용] 호출마다 U(lo, hi) ms, 평균 50 ms (명세 4.9 최대 100 ms)
    drop_rate: 0.0                   # [시작 전용] 호출 유실 확률 → assign_timeout_s 뒤 다음 후보로 재할당
    seed: 0                          # [시작 전용] 0 = 무작위, 그 외 재현용 시드
    log_dir: ""                      # [시작 전용] "" = $ROS_WS/logs → tasks_ / allocation_YYYYmmdd.csv
                                     # (파일 날짜는 벽시계, 시각 칸은 노드 시계)
    log_time_format: iso             # [시작 전용] iso | epoch (use_sim_time 이면 epoch 권장)
    allocation_period_s: 0.5         # [시작 전용] 주기 할당 라운드 (로봇이 비면 여기서 잡힌다)
    allocation_batch_window_s: 0.01  # JSON 작업 도착 후 이만큼 모아 한 라운드로 할당 (0 = 도착마다 즉시).
                                     # 10 ms: 한 묶음을 연달아 발행하면 수 ms 안에 도착하므로 hungarian 이
                                     # 동시 도착분을 한 번에 풀고, 응답 예산(평균 200 ms, sequences.md §1 의
                                     # "플릿 할당 ≤ 20 ms")은 거의 쓰지 않는다. 0.2 s 는 예산을 혼자 다 썼다.
                                     # /fleet/assign_task 서비스는 응답에 robot_id 를 주려고 즉시 할당한다
    status_period_s: 1.0             # [시작 전용] /fleet/status 1 Hz
    discovery_period_s: 2.0          # [시작 전용]
    robot_state_timeout_s: 5.0       # robot_state 가 이보다 오래되면 할당 후보 제외 + 오프라인 처리
                                     # (fleet/ROBOT_LOST, FleetStatus status=ERROR, 진행 중 작업 FAILED(robot_lost))
    assign_timeout_s: 3.0            # 로봇 assign_task 응답 대기 상한. 유실(보내지 못함)은 곧바로 재할당,
                                     # 보낸 호출은 fleet/ASSIGN_TIMEOUT 후 수락 여부를 확인할 때까지 보류
    assign_reconcile_s: 2.0          # 보류 뒤 이만큼 더 지나 받은 robot_state 에도 작업이 없으면 재할당
    reject_backoff_s: 1.0            # 거절/실패한 로봇에 다시 시도하기까지 대기
    max_task_retries: 0              # 실패 후 재시도(FAILED → PENDING) 횟수. 실패 횟수로 센다 (0 = 재할당 없음)
    task_timeout_s: 600.0            # 진행 중 작업 상한 [s] (0 = 없음). 초과 시 FAILED(timeout)
    throughput_window_s: 1800.0      # [시작 전용] 처리량 슬라이딩 창 (30 분; 10 분 창은 30 건/h 에서 ~5 건)
    utilization_mode: assigned       # [시작 전용] robot_utilization 의 busy 정의: assigned = 진행 중 작업 보유
                                     # 시간 (작업 로그 duration 과 같은 구간) | moving = MOVING/DOCKING/LOADING
    task_schema_path: ""             # [시작 전용] "" = share/amr_fleet/config/task_schema.json
    robot_params_path: ""            # [시작 전용] "" = $ROS_WS/config/robot_params.yaml (payload 질량 표)
    scheduler:                       # [시작 전용] 전부
      band_width: 32                 # 우선순위 밴드 폭 (0~255 → 8 밴드), 밴드 안에서 EDF
      deadline_weight: 1.0           # 밴드 내 slack 가중치 (1, 0 = 순수 EDF)
      fifo_weight: 0.0               # 밴드 내 도착순 가중치
      age_boost_rate: 0.5            # [priority/s] 대기 시간에 따른 우선순위 가산 (기아 방지)
      age_boost_max: 64.0            # 가산 상한 (= 2 밴드)

/**/fleet_adapter_node:
  ros__parameters:
    robot_id: ""                     # "" = 네임스페이스에서 유도
    publish_rate_hz: 2.0             # robot_state 발행 주기
    simulate_latency: true           # robot_state 송신 지연 큐 (multi_robot.md §6)
    comm_latency_ms: [0.0, 100.0]    # 메시지마다 U(lo, hi) ms
    drop_rate: 0.0                   # robot_state 유실 확률
    seed: 0                          # 0 = 무작위. 0 이 아니면 robot_id 별로 다른 시퀀스
    auto_complete_after_s: 0.0       # > 0 이면 실행기 없이 N s 뒤 완료를 흉내 (테스트 전용)
    serve_assign_task: false         # 실제 assign_task 서버는 amr_behavior 의 task_executor_node (§5.5).
                                     # true 는 실행기 없는 모의 시험 전용 (auto_complete_after_s 와 짝;
                                     # 런치는 auto_complete_after_s > 0 이면 자동으로 켠다)
    initial_battery: 100.0           # battery_state 미수신 시 보고값 [%]
    log_dir: ""                      # "" = $ROS_WS/logs → comm_latency_<robot>_YYYYmmdd.csv
