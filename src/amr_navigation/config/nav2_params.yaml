# Nav2 파라미터 템플릿 — amr_navigation (components.md §3.3 / §5.3 / §6, multi_robot.md §4)
#
# 이 파일은 템플릿이다. navigation.launch.py 가
#   1) nav2_common ReplaceString 으로 '<prefix>' → 프레임 접두어 (다중 로봇: 'amr_01/', 단일: '')
#   2) nav2_common RewrittenYaml(root_key=<robot_name>) 으로 네임스페이스 키를 씌우고 use_sim_time·BT 경로를 덮어쓴다.
# 토픽은 모두 로봇 네임스페이스 아래이고, /map 과 /tf 만 공유한다 (multi_robot.md: /tf 리맵 금지).
# 주의: Humble 의 Costmap2DROS 는 '<ns>/<costmap 이름>' 네임스페이스의 자식 노드라서, 레이어가 구독하는
#   상대 토픽 'scan_filtered' 는 /amr_01/local_costmap/scan_filtered 로 풀린다 (실측: ros2 topic info).
#   그래서 코스트맵 레이어 토픽만 '<robot_ns>/…' 로 적고 런치가 '<robot_ns>' → '/amr_01' 로 바꿔 절대 이름을
#   만든다 (네임스페이스 없음이면 '' → '/scan_filtered'). 서버 노드 자체의 토픽(odom_topic 등)은 상대 이름.
# 로봇 한계(속도·가속·저크)는 config/robot_params.yaml 의 limits.* 가 단일 출처다: 런치가 controller_server 에
# robot_params.yaml 을 함께 넘기고, DWA/PurePursuit 플러그인은 자기 파라미터가 없으면 limits.* 를 쓴다.
# 튜닝 근거: docs/algorithms/{astar,dwa,path_tracking,costmap}.md
#
# 풋프린트 산술 (docs/algorithms/costmap.md): 0.60 x 0.40 m 사각형, padding 0
#   r_ins = 0.20 m, r_circ = √(0.30² + 0.20²) = 0.361 m
#   0.60 m 통로(로봇 폭 + 0.20) 중앙: 벽까지 0.30 m → c = 252·exp(−s·(0.30 − 0.20))
#     전역 s = 2.0 → 206, 지역 s = 3.0 → 186 (둘 다 < 253 INSCRIBED → 통과 가능)

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 1.0          # [Hz] BT RateController 1 Hz 재계획과 같게 (경고 기준)
    planner_plugins: ["AStar", "NavFn", "Smac"]   # planner_id (components.md §5.3)
    AStar:
      plugin: "amr_navigation::AStarPlanner"
      cost_weight: 2.0                 # κ: 간선 가중 ℓ·(1 + κ·c/252). 0 = 최단거리, 2.0 = Smac cost_travel_multiplier 와 같게
                                       #    (비교 공정성). 크게 하면 장애물에서 멀어지지만 길어진다 (astar.md 튜닝 표)
      allow_unknown: True              # 미지(255) 셀 통행 허용 (SLAM 지도 가장자리 미지 영역 관통 허용)
      unknown_cost: 252                # 미지 셀을 이 비용으로 취급 (가장 비싼 통행 가능 셀과 같게 → 미지 회피)
      tolerance: 0.25                  # [m] 목표가 막혔을 때 대체 목표 탐색 반경 (NavFn/Smac 과 같은 값)
      max_iterations: 0                # 확장 수 상한 (0 = 셀 수, 즉 무제한)
      max_planning_time: 0.4           # [s] 탐색 마감. 명세 "재계획 500 ms 이내" 에서 평활화·통신 여유 0.1 s
      allow_corner_cutting: False      # 대각 이동 시 두 직교 이웃이 모두 통행 가능해야 함 (모서리 스침 방지)
      allow_start_in_inscribed: True   # 시작이 INSCRIBED(253) 안이면 그 구역을 빠져나오는 동안만 통행 허용
      use_final_approach_orientation: False   # False: 마지막 자세 방향 = 목표 방향
      smoother:
        enable_shortcut: True
        shortcut_max_length: 10.0      # [m] 숏컷 현 길이 상한 (긴 현이 비용 적분을 과소평가하는 것을 방지)
        shortcut_cost_ratio: 0.05      # δ: 현 비용 ≤ (1+δ)·원래 격자 경로 비용일 때만 채택
        clearance_cost_margin: 10      # [cost] 현 최대 셀 비용 ≤ 구간 최대 비용 + 10 (≈ 여유거리 1 셀 손실 허용)
        output_spacing: 0.05           # [m] 출력 경로 점 간격 (= 코스트맵 해상도)
        enable_smoothing: True
        w_data: 0.2                    # 데이터 항 (숏컷 경로에 붙잡아 두는 힘)
        w_smooth: 0.3                  # 평활 항 (이웃 평균 쪽으로). 0 < w_data + 2 w_smooth < 2 에서 수렴
        w_clearance: 0.3               # 여유 항 (비용 기울기 반대 방향, 셀 단위 스텝 × 비용 초과율)
        clearance_cost_threshold: 100  # 이 비용(여유 ≈ 0.66 m) 이상인 점만 밀어낸다
        max_iterations: 100            # Gauss–Seidel 스윕 수 상한
        tolerance: 0.0001              # [m] 스윕 총 이동량이 이보다 작으면 수렴
    NavFn:                             # 비교군 1 (명세 4.4 "NavFn 또는 Smac 과 비교")
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: False
      allow_unknown: True
    Smac:                              # 비교군 2: Smac 2D (8-연결 A*, Euclid 휴리스틱, 자체 평활기)
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: False
      downsampling_factor: 1
      allow_unknown: True
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0           # [s]
      cost_travel_multiplier: 2.0      # AStar.cost_weight 와 같은 κ
      use_final_approach_orientation: False
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0         # [Hz] 명세 20 Hz 제어 주기 (DWA 동적 창 Δt = 0.05 s)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0             # [s] 플러그인 예외 후 0 속도로 버티는 시간 → 넘으면 FollowPath 실패(BT 복구)
    odom_topic: odometry/filtered      # 상대 이름 (ekf_filter_node_odom)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["DWA", "PurePursuit", "DWB", "RPP"]   # controller_id (DWB·RPP 는 비교용)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3    # [m]
      movement_time_allowance: 20.0    # [s] 동적 장애물 대기(정지) 시간을 허용
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: False                  # 위치 검사를 잠그지 않는다. True 면 허용치 안에 한 번
                                       # 들어온 뒤로는 자세만 보므로, 목표에 닿은 뒤 작업자를
                                       # 피해 물러나면 떨어진 채로 "도달" 이 된다 — 08 실측:
                                       # 목표까지 최소 0.026 m 까지 갔다가 0.377 m 지점에서
                                       # 종료, 그때 추정 위치도 0.364 m (위치 추정 오차는
                                       # 0.012 m 로 멀쩡했다). 통로 이탈 후진을 연 뒤로 생겼다.
                                       # 제자리 회전은 차동 구동이라 위치를 거의 바꾸지 않으므로
                                       # 자세 정렬 중 허용치를 벗어나지 않는다.
      xy_goal_tolerance: 0.10          # [m] 도킹 전 접근 정밀도 (정밀 도킹 2 cm 는 docking_server 담당)
      yaw_goal_tolerance: 0.05         # [rad]
    DWA:
      plugin: "amr_navigation::DWAController"
      # 속도 한계: 운용 최고속도 1.0 m/s (하드웨어 한계 limits.max_linear_velocity 2.0 은 safety 의 여유거리
      # 속도 제한상 전방 2.6 m 이상 비었을 때만 허용 → 창고 통로에서는 1.0 이 실효 상한). 가속·저크는 limits.*
      max_vel_x: 1.0                   # [m/s]
      min_vel_x: 0.0                   # [m/s] 후진은 BackUp 복구 동작만 (DWA 샘플에서 제외)
      # max_vel_theta / acc_lim_x / decel_lim_x / acc_lim_theta / jerk_lim_x 는 두지 않는다 →
      # robot_params.yaml limits.{max_angular_velocity, max_linear_acceleration, max_angular_acceleration,
      # max_linear_jerk} 가 기본값 (단일 출처). 실험 시에만 여기서 덮어쓴다.
      vx_samples: 11                  # 동적 창 v 샘플 수 (창 폭 0.10 m/s → 0.01 m/s 해상도)
      vth_samples: 31                  # ω 샘플 수 (창 폭 0.20 rad/s → 0.0067 rad/s 해상도)
      # R1+R2 — 후보를 1주기 도달속도가 아니라 **지속 목표 명령**으로 잡고 롤아웃을 가속·저크
      # 램프로 적분한다. 방출은 t = control_period 의 램프 상태라 하류의 1주기 가속 계약은 그대로.
      # 근거 (logs/R0a+R0b 60 시행 20 013 주기, docs/research/dynamic-avoidance-root-cause §6):
      #   위험 구간 후보 종점 변위 스팬 중앙 0.0719 m — 후보 342 개가 물리적으로 거의 같았다.
      #   원형 계산으로 이 값이 0.85 m (11.3 배) 가 된다.
      # **2026-09-30 되돌림.** 켜서 30시행 x 3 을 재니 파국적으로 나빠졌다:
      #   접촉 28/14/25 (기준선 2/0), 이탈 3.07/3.23/4.24 m (기준선 1.12), 복귀 127 s~무한,
      #   소요 3237~3350 s (기준선 532). 시행이 잘려 18/17/19 만 돌았다.
      # 계측이 기제를 짚었다 (logs/R12a vs logs/R0a):
      #   disp_span 중앙 0.0771 -> 0.8666 m  = 의도대로 후보가 넓어졌다
      #   그런데 |cmd_v| 중앙 0.8800 -> 0.1102 = 계획기가 **느린 후보만 고른다**
      # 원인은 J_dyn 이다. excess = max(0, |v| - v_safe) 는 c.v 가 [0, 0.05] 라 늘 0 인 죽은
      # 항이었는데, 후보가 넓어지자 빠른 후보에만 큰 벌점을 주는 살아 있는 항이 됐다.
      # 즉 비용 가중치가 **망가진 후보 집합에 맞춰 튜닝돼 있었고**, 후보 집합을 고치면
      # 가중치가 틀렸다는 것이 드러난다. 비용 함수를 먼저 고쳐야 이 플래그를 켤 수 있다.
      # **2026-09-30 끔.** 4시간 소크가 회귀를 드러냈다: 작업 완료 59 -> 7, 나머지 6 건이
      # 전부 900 s 타임아웃, controller_server 에 "no valid trajectory (all samples collide)"
      # 9211 회 · "Failed to make progress" 511 회.
      # 원인 (tools/cost_probe --aisle 로 오프라인 확인): 롤아웃이 0.075 -> 0.85 m 로 11 배
      # 길어져 **좁은 통로에서 후보가 대량 탈락**한다. 통로 순폭별 무충돌 후보 수 (232 중):
      #   열린 공간 232 -> 232 | 1.2 m 232 -> 140 | 0.9 m 232 -> 86 | 0.7 m 232 -> **32**
      # 08 은 열린 횡단 기하라 이것이 드러나지 않았고, 랙 통로를 도는 소크에서 터졌다.
      # 이득 쪽은 증명된 적이 없다 — 08 접촉 2/90 vs 2/60, Fisher p = 1.0000.
      # 켜려면 롤아웃 길이를 통로 폭에 맞춰 줄이는 기제가 먼저 필요하다.
      sustained_sampling: false
      sim_dt: 0.1                      # [s] 롤아웃 간격
      sim_time_min: 1.5                # [s] T_sim(v) = clip(|v|/a + 0.5, min, max) — 정지거리 이상을 본다
      sim_time_max: 2.5                # [s]
      commit_time: 0.2                 # [s] 명령 유지 후 제동 시작 (Δt_c + 반응 지연)
      approach_latency: 0.3            # [s] 목표 접근 v_des = d_stop⁻¹(d_goal) 의 명령→실속도 지연 t_c.
                                       #     하류 저크 필터의 램프 지연 a/2j 0.25 + 서보 0.04~0.12 ≈ 0.3.
                                       #     체인 시뮬레이션 튜닝 표 (path_tracking.md §1.4): 0.1 → 9 cm 통과,
                                       #     0.3 → 0.2 cm, 사다리꼴 √(2ad) → 40 cm 통과
      window_reset_v: 0.3              # [m/s] 직전 명령과 측정 차가 이보다 크면 창 중심 = 측정
      window_reset_w: 0.5              # [rad/s]
      heading_weight: 0.6              # 비용 가중치 (항별 [0,1] 정규화). tracking_sim 격자 탐색 결과 (dwa.md §4.1):
      clearance_weight: 1.0            #   (0.8/1.2, 전체 롤아웃 평가) → (0.6/2.0, 앞 0.8 s): 곡선 CTE 평균 U 턴 3.7 → 0.5 cm,
                                       #   S 자 16.1 → 0.9 cm, 주행 시간 오차 17.6 → 1.5 %
      velocity_weight: 0.4
      path_weight: 2.0
      oscillation_weight: 0.5
      dynamic_weight: 1.5
      path_eval_time: 0.8              # [s] 헤딩·경로 항은 롤아웃 앞 0.8 s 만 평가 (충돌·여유는 전체 T_sim):
                                       #     1.5 s 등곡률 원호가 S 자 경로의 평균 곡률로 안쪽을 가로지르는 것 방지
      heading_lookahead_gain: 0.4      # ℓ(v) = clip(0.4 v + 0.3, 0.4, 1.2) [m] 헤딩 목표점 거리 (평가 끝점 기준)
      heading_lookahead_offset: 0.3
      heading_lookahead_min: 0.4
      heading_lookahead_max: 1.2
      path_band: 0.8                   # [m] 경로 이탈 비용 정규화 폭
      # J_off (dwa.md §1.5): J_path 는 path_band 0.8 m 에서 포화해 멀리서는 경로로 되돌리는 힘이 없다
      # (시나리오 08 에서 VO 가 경로 위 샘플을 모두 막자 최대 이탈 6.45 m). 한계를 넘는 만큼만 강하게 벌한다.
      off_path_weight: 3.0             # 가중 w_f (다른 어느 항보다 커야 되돌린다)
      max_path_offset: 0.9             # [m] 벌점이 걸리기 시작하는 이탈 (명세 4.7 상한 1.0 m 안쪽)
      max_path_offset_hard: 0.95       # [m] 이탈 예산 (명세 4.7 상한 1.0 m 안쪽). 두 곳에 쓴다 —
                                       # J_off 래칫("이미 벗어난 만큼"으로 한계를 올려 주는)의 상한,
                                       # 그리고 VO 포화 시 통로 탈출 후보의 자격. 후자가 없으면 탈출
                                       # 순위가 비용(=이탈 벌점)을 보지 않아 통로 반폭까지 밀려난다
                                       # (08 실측 e8b: 이탈 1.390 m = 반폭 1.311 m, 복귀 9.66 s).
      off_path_band: 1.0               # [m] 정규화 폭. 1.0 이었을 때 J_off 기울기는 w_f/폭 = 3.0 /m
                                       # 이라, 한계 0.95 m 에서 J_dyn 이 포화해도(w_dyn = 1.5) 이탈
                                       # 0.95 + 1.5/3.0 = **1.45 m 까지는 넓게 도는 쪽이 이득**이었다.
                                       # 08 실측의 이탈 실패가 전부 그 천장 아래다 (1.058 / 1.139 /
                                       # 1.207 / 1.363, 전부 vo_rejected 0 = 평상 비용 최소화 결과).
                                       # 0.05 로 좁히면 명세 한계 1.0 m 에서 J_off = 3.0 이라 경쟁
                                       # 항(최대 1.5)이 이길 수 없다. 0.95 m 아래에서는 이 항이 원래
                                       # 0 이라 그 구간 거동은 바뀌지 않는다.
      goal_align_distance: 0.08        # [m] 목표 정렬(제자리 회전) 시작 거리 (≤ xy_goal_tolerance)
      goal_overshoot_margin: 0.1       # [m] 목표 너머 충돌 검사 여유
      path_horizon: 4.0                # [m] 코스트맵 프레임으로 옮길 경로 길이 (로컬 코스트맵 반폭)
      no_valid_patience: 10            # 유효 샘플 없음이 이 주기 수 이어지고 정지 상태면 예외 → BT 복구
      use_dynamic_obstacles: True      # perception/tracked_obstacles 예측 위치 → TTC₀ 비용
      use_velocity_obstacles: True     # VO 원뿔 안 샘플 제외 (명세 4.7)
      prediction_time: 5.0             # [s] TTC₀ 예측 지평
      dynamic_margin: 0.5              # [m] TTC₀ 접촉 여유 = safety.critical_zone_distance
      vo_time_horizon: 2.0             # [s] VO 절단 시간 τ
      vo_margin: 0.3                   # [m] VO 합성 반경 여유 = safety.emergency_stop_distance
      vo_max_range: 6.0                # [m]
      dynamic_speed_threshold: 0.2     # [m/s] 이보다 느린 트랙은 정적(코스트맵이 처리) — 추적기 is_dynamic 기준과 같게
      dynamic_fast_speed: 0.5          # [m/s] is_dynamic 이 아니어도 이 속도 이상 트랙은 동적 (정지 물체 트랙 속도 잡음 0.2–0.3 은 제외)
      dynamic_steer_gain: 0.3          # λ: J_dyn = 과속분(v − v_safe(TTC₀)) + λ(1 − TTC₀/T_pred) — 보조항 (dwa.md §2.2)
      vo_time_tie: 0.02                # [s] VO 포화 시 진입 시각이 이 안이면 같다고 보고 비용으로 고른다 (dwa.md §2.1)
      yield_crossing: True             # 횡단 양보: 동적 장애물의 예측 통로 **밖** 가상 정지선 앞에 선다 (dwa.md §2.3).
                                       #   VO/TTC 만으로는 통로 **안**에서 멈춰 서고, 비키지 않는 사람이 걸어 들어온다
      yield_corridor_margin: 0.7       # [m] 통로 반폭 여유. 1.2 에서 되돌린다 — 탈출 이득이
                                       # 로봇을 반폭 R_c 까지 밀어내므로 이 값이 곧 이탈 목표다.
                                       # R_c = 0.361 + 0.30 + 0.7 = 1.361 (i·j 계열 1.311 과 같은 급).
                                       # 실측: 1.2 일 때 최대 이탈 1.27~1.50 (통과 0/13), 0.7 로
                                       # 되돌린 y 계열은 0.75~1.04 (y8a 0.840). 게이트를 켜면 탈출
                                       # 자체가 꺼지므로 이 값은 감지 폭으로만 쓰인다.
      yield_stop_margin: 0.8           # [m] 통로 입구 앞 정지선 여유 (경로 호길이). 0.25 → 0.8:
                                       # 추적기 진행각 잡음(실측 ±28°/0.5 s)으로 통로가 회전해
                                       # 정지선이 흔들린다 — 08 로그 190 표본에서 로봇 이동으로
                                       # 설명되지 않는 정지선 이동이 중앙 0.04 m, 90 % 0.23 m,
                                       # 최대 1.83 m. 여유 0.25 m 는 감속 한계로 정확히 정지선에
                                       # 서는 계획이라 이 흔들림을 못 견딘다.
      yield_clear_margin: 2.0          # [s] "먼저 빠져나간다" 판정의 시간 여유. 1.0 → 2.0:
                                       # 08 실측에서 통로 안에 들어선 뒤 멈춘(committed) 접촉이
                                       # 남았다 — 통로 밖에 서는 쪽을 더 자주 고르게 한다.
                                       # 들어간 뒤의 후진 이탈은 마지막 수단이다
      yield_horizon: 8.0               # [s] 장애물 등속 예측 지평 (통로 길이 = max(|u|, nominal)·8 s)
      yield_nominal_speed: 1.0         # [m/s] 통로 길이의 속도 바닥. 반환점에서 돌아서는 작업자는
      yield_hold_standoff: 0.35        # [m] hold 가 몸 원통보다 이만큼 앞에 선다 (차선 거리)
      yield_approach_radius: 3.0       # [m] 방향을 쓰지 않는 접근 정지선. 로봇이 경로점에 닿을
                                       # 때까지 사람이 갈 수 있는 거리를 반경에 더해, 그 안에 드는
                                       # 첫 점 앞에서 선다. 통로 모델은 추적 속도의 **방향** 에
                                       # 기대는데 08 실패는 전부 작업자가 반환점에서 도는 구간이었고
                                       # (속도 0.01~0.08 → 1.1~1.6, 헤딩 63~360°) 그때는 방향이
                                       # 무의미하다. 이 규칙은 위치만 보므로 면역이다.
      yield_approach_horizon: 3.0      # [s] 위 성장의 상한 시간. 로봇이 몸 원통을 지나는 데
      yield_decision_dwell: 0.8        # [s] 결정(go/hold/retreat) 최소 유지 시간. 08 실측에서
                                       # 접촉이 난 시행이 전부 분기 진동이었다 (s8a 는 410 주기에
                                       # 31회 전환). 매 주기 여유 추정이 흔들려 분기가 바뀌면
                                       # 지나가지도 물러나지도 못한다. 방향을 막는 방식(보수적인
                                       # 쪽으로만)은 retreat 고착으로 더 나빴다 — q 계열 접촉 5.1 %.
                                       # 2·0.661/sin(26.6°)/1.0 ≈ 3 s 걸린다.
                                       # |u| 가 0.01~0.08 까지 떨어져 통로가 사라졌다가 가속하면
                                       # 12 m 로 폭발한다 — 그때는 이미 로봇이 안에 있다. 08 실패
                                       # 9건이 전부 그 구간이었고(헤딩 변화 63~360°), 구간 입구가
                                       # 0.19 s 만에 2.07 m → 0 으로 튀었다. 명세 4.1 의 동적 장애물
                                       # 속도 범위(0.3~1.5 m/s) 중간값으로 바닥을 깐다.
      yield_lookahead: 4.0             # [m] 경로에서 교차 구간을 찾는 거리 (≤ path_horizon)
      yield_max_zone: 6.0               # [m] R_c 1.861 · 26.6° 교차 구간 8.3 m 를 담는다
                                       # 설계 하한 교차각 22.6° 에서 2·R_c/sin: R_c 1.311(반지름 0.25)
                                       # 이면 6.8, obstacle_radius 0.30 으로 R_c 가 1.361 이 된 뒤에는
                                       # 7.1. **6.0 그대로 두면 08 의 26.6° 교차 구간(6.09 m)이 밖으로
                                       # 나가 접근 정지선이 사라진다** (k 계열: 반지름 0.30 뒤 이탈이
                                       # 5회 전부 1.0 m 언저리로 오른 원인의 후보)
      # 이미 통로 안(kCommitted)에서 멈추면 장애물이 그대로 걸어 들어온다 (시나리오 08 회귀 실행:
      # 접촉 4건이 모두 로봇 속도 0 · committed · 차선 가로 거리 ≤ 0.65 m). 앞은 VO 가 막으므로
      # 나갈 길은 뒤뿐이다 — 그 상태에서만 후진 샘플을 열고, 통로 축에서 멀어지는 후보에 이득을 준다
      yield_escape_speed: 0.5          # [m/s] kCommitted 후진 상한 (0 = 끔). 0.25 → 0.5: 통로 반폭
                                       # (R_c ≈ 1.3 m)을 벗어나려면 0.25 m/s 로는 2.4 s 가 걸려 늦었다
                                       # (08 3회 반복: 잔여 접촉 4건이 모두 정지·committed 상태)
      escape_weight: 2.5               # w_e: 통로 축에서 멀어지는 후보 이득 (off_path 3.0 보다 작게)
      yield_escape_drift: 0.15         # [m] 지금보다 이만큼 넘게 더 벗어나는 이탈에는 이득 없음
      escape_min_speed: 0.05           # [m/s] 몸 원통 안에서 "움직이는 후보" 로 치는 하한. VO 포화 시
                                       # 이보다 느린 후보(= 순수 제자리 회전)는 선택에서 뺀다 — 차동
                                       # 구동은 회전으로 위치가 안 변해 β 가 그대로라 서 있는 것과 같다
                                       # (08 실측 reg1 접촉 2건이 전부 이 모양).
      # 통로 안(kCommitted) 진입 시점의 결정 go / hold / retreat (core::YieldDecision, dwa.md §2.3).
      # 08 접촉 4건(j8c t6·t21, reg1 t12·t13)의 공통 기제는 "정지선 없이 통로 안에 들어선 채 점진
      # 감속 + 선회" 였다 — 진입 3.4~5.1 s 뒤 접촉, 순 선회 −31°~−133°, VO 포화 1.2~2.3 s 전, 그 전에
      # v < 0.4 로 가로 권한(∝ v) 상실. 넷 다 진입 순간에 옳은 행동이 따로 있었다: 직진(j8c t6, 여유
      # ≈ 0.7 s → retreat 경계), 즉시 정지(j8c t21·reg1 t13, β 1.05~1.45 에서 설 수 있었다), 축에서
      # 멀어지기(reg1 t12). 위험 구간은 R_c 통로가 아니라 **몸 원통**(0.361 + 0.30 + 여유)으로 잰다.
      # 되켜 봤다가 **측정으로 반증**했다 (x8a, 30시행): 접촉 4, 최대 이탈 1.504 — 끈 상태
      # (u 계열 5회 평균 접촉 4/150, 최대 이탈 1.43)보다 두 지표 다 나쁘다. 이유는 실제 기하다:
      # 결정은 cross_sin >= decision_min_sin(0.34 = 20°)에서만 내리는데, 실측 계획은 보행 차선
      # y=-7 과 거의 나란히(초기 진행각 -26.2°, 직선 대비 이격 0.92 m) 달리다가 x≈2.16 에서
      # 41.7° 로 건넌다. 결정이 켜지는 지점에서는 이미 축에서 0.2 m 라 robot_in_body 가 되어
      # retreat 밖에 나올 수 없고, retreat 는 알려진 최악 상태다 (q 계열 접촉 5.10%).
      # 탈출 이득의 상한(beta_target)이 결정에 묶여 있는 문제는 남아 있으나, 켜는 것으로는
      # 못 고친다 — 노출 구간 **밖**에서 진입 전에 결정하는 구조가 필요하다.
      yield_decision: false
      yield_body_margin: 0.15          # [m] 몸 원통 여유. 추적 가로 오차 p95 0.26 m 보다 작지만, 실제
                                       # 여유는 발자국 방향에 따라 +0.06~0.16 m 가 더 있고(외접 0.361
                                       # 대비), 더 키우면 hold 가 성립하는 창(통로 진입 뒤 ~1.4 s)이
                                       # 사라져 전부 retreat(이탈 비용)가 된다
      yield_go_margin: 0.0             # [s] go 의 시간 여유 하한: 로봇이 위험 구간을 다 지날 때 작업자
                                       # 앞이 뒤에 있기만 하면 된다 — 얼마나 안전한지는 아래 예측 여유로
      yield_go_clearance: 0.40         # [m] go 진입: 스칠 때 몸 사이 **예측 여유** 하한. 같은 시간 여유라도
                                       # 교차각이 가파를수록 여유가 크다: 08 기하(26.6°, 둘 다 1.0 m/s)
                                       # 에서 0.15 + 0.236·(시간 여유 + 0.661) → 0.40 m 는 시간 여유
                                       # 0.4 s, 90° 교차에서는 0.81 + 시간 여유. 작업자가 추정보다 20 %
                                       # 빨라도(2.4 s 동안 0.48 m) 26.6° 에서 0.29 m 가 남는다. 시간
                                       # 여유 1.0 s(0.54 m)로 두면 j8c t6(0.78 s → 0.49 m)가 retreat
                                       # 로 가는데, 그 기하에서 옆으로 물러나면 경로 자체가 남쪽으로
                                       # 멀어져 이탈 1.0~1.2 m 를 쓴다 (재현 시험)
      yield_go_hold_clearance: 0.30    # [m] go 유지 하한 (추적기 속도 추정이 한 주기 튀어도 안 뒤집히게)
      yield_go_speed_floor: 1.0        # [m/s] go 의 "로봇이 먼저" 여유를 잴 때 작업자 속도 하한 (= 이 월드
                                       # 작업자의 공칭 속도). 차선 끝에서 돌아선 직후 평활 속도(τ 0.5 s)는
                                       # 0.3 → 1.0 으로 오르는 중이라 그때 잰 여유는 최대 2 배 크다 —
                                       # 08 접촉 4건이 전부 그 순간에 committed 로 들어갔다
      yield_hold_slack: 0.3            # [m] hold 가능 판정: d_stop(v) ≤ 입구까지 거리 + 이 값. 제동 중
                                       # 바깥으로 조향하면 안쪽 표류(1.0 m/s 에서 0.465 m)가 그만큼 준다
      yield_decision_min_sin: 0.34     # 결정을 내리는 교차각 하한 sin θ (20°). 정면·같은 차선 추종은
                                       # 예전 그대로 VO/TTC 와 원통 안 탈출이 맡는다
      # 횡단 게이트 (T안, core/crossing_gate.hpp, dwa.md §2.5). 켜면 §2.3–2.4 의 통로 정지선·결정층을
      # **대신한다**. 근거: 실측 첫 계획은 26.6° 직선이 아니라 좁은 통로 랙의 팽창 경계를 따라 보행 차선
      # y=−7 과 나란히(17°) 달리다 45° 로 건넌다 (w8a 실측 이격 0.92~0.97 m, 몸 원통 안 2.74 m + y=−6 띠
      # 3.00 m = 연속 노출 5.7 m). 그 안에서는 어떤 지역 계획기 결정도 작동할 수 없어, 노출 구간 **밖**
      # 정지점에서 진입 전에 판정하고 커밋 뒤에는 개입하지 않는다. 출발 위상 610개 시뮬레이션:
      # 접촉 0/610 (양방향), 최소 여유 +0.43/+0.29 m, 대기 평균 1.4~1.7 s·최대 7 s.
      # 되돌아옴 모델(gate_turn_time·gate_walk_accel)이 없으면 39/610 접촉 — 반환점이 노출 구간 끝에서
      # 2.6 m 뿐이라 "멀어지는" 보행자가 5 s 안에 돌아온다. 값은 시뮬레이션 상수 그대로.
      # 끈다. 실측으로 게이트가 접촉을 4 배 올린다 — 같은 하네스·같은 seed 에서
      # 게이트 OFF·띠 없음(y 계열 150 시행) 접촉 4.0 %, 게이트 ON·띠 없음(g 계열 60 시행)
      # 15.0 %, 게이트 ON·띠 있음(L 계열 90 시행) 15.6 %. 복귀도 3.6~6.5 s → 12~27 s 로
      # 나빠진다 (게이트 대기 시간이 하네스에 미복귀로 잡힌다).
      # 원인: 게이트가 켜지면 escaping 이 꺼지고(dwa.cpp `escaping = !gate_on && …`)
      # 커밋된 트랙은 VO·TTC 에서도 면제되어, 예방이 실패한 순간 물러설 곳이 없다.
      # 접촉 9 건 전부 로봇 정지(8/9) 중 작업자가 걸어 들어온 모양이다.
      # 시나리오 07 에서는 게이트가 옳았다 (CTE 0.1696 → 0.0099). 경로가 보행 차선 안에
      # 머물지 않아 안전한 대기 지점이 있었기 때문이다. 08 의 A↔B 경로에는 그 자리가 없다.
      yield_gate: false
      gate_hold_back: 1.2              # [m] 노출 구간 시작 전 정지점. 0.7 도 접촉 0/610 (여유 +0.29) 이고
                                       #     B→A 에서 좁은 통로 랙 뒤 차선이 보이는 자리라 대기가 4.3 → 1.4 s
      gate_delay: 0.3                  # [s] 관측 지연 (도달 시간에 더한다)
      gate_pos_err: 0.25               # [m] 추적 위치 오차 (반경 합에 더한다: 0.361 + 0.30 + 0.25 = 0.911)
      gate_heading_unc: 0.1            # [rad] 진행선 방향 불확실도 — 통로 반폭이 거리에 비례해 자란다
      gate_v_max: 1.0                  # [m/s] 보행자 가정 최고 속도 (명세 상한 1.5 로 두면 대기 평균 +1.4 s)
      gate_vknown: 0.3                 # [m/s] 변위 평균 속력이 이 이상이면 방향 **부호만** 믿는다. 크기는 안 믿는다
      gate_turn_time: 1.57             # [s] 되돌아옴: 제자리 회전 (180° / 2 rad/s)
      gate_walk_accel: 0.6             # [m/s²] 보행 가감속 (정지 v/a + 재가속)
      gate_static_timeout: 5.0         # [s] 방향 없이 이보다 오래 선 트랙은 정적 (코스트맵 몫). 반환점 정지는 ≈ 2.6 s
      gate_lookahead: 8.0              # [m] 노출 구간을 찾는 경로 길이 (창 길이 = max(path_horizon, 이 값))
      gate_group_gap: 1.5              # [m] 이 간격 안의 노출 구간은 하나로 (그 사이에 설 자리가 없다)
      gate_hold_tol: 0.3               # [m] 정지점 허용 오차
      gate_hold_threat_horizon: 3.0    # [s] 정지 자리 위협 판정 (이 안에 닿을 수 있으면 물러난다)
      gate_hold_exclusion_horizon: 10.0  # [s] 정지점 배제: 방향을 아는 트랙의 진행선 통로 안(앞 전부 + 이 안에
                                       #     되돌아올 수 있는 뒤)에는 서지 않는다 — 포팅 시뮬레이션에서 시간만
                                       #     보고 통로 안에 섰더니 B→A 62/610 접촉 (전부 차선 축 위 정지 중)
      gate_commit_max_run: 2.0         # [m] 강제 커밋(전속 통과)은 출구까지 이 안일 때만 — 나란한 구간(5 m)에서는
                                       #     달려도 마주 오는 보행자를 못 벗어나므로 서서 물러난다
      gate_retreat: true               # 정지 자리가 위협받으면 경로를 따라 후진 (이탈 0) — 멀어질 때만
      gate_retreat_speed: 0.5          # [m/s] = 안전 게이트 retreat_max_speed (TTC 상한을 면제받는 증명된 후퇴 상한)
      gate_retreat_max: 4.0            # [m] 한 조우에서 물러나는 거리 상한. 2.0 이면 B→A 에서 늦게 발견한 뒤
                                       #     물러나도 차선 띠(|y+7| < 0.91) 안에 남아 접촉했다 (포팅 시뮬레이션)
      gate_line_window: 1.5            # [s] 진행 방향을 정하는 변위 창 (순간 속도 방향은 반환점에서 63~360° 돈다)
      gate_track_memory: 2.0           # [s] 사라진 트랙을 방향 모름 위협으로 기억 (가림·추적 끊김 대비)
      yield_escape_v_meas: 0.05        # [m/s] 측정 속도가 이보다 낮을 때만 (정지·후진 중) — 주행 중
                                       # 열어 두면 후진↔전진이 되풀이된다 (14 실측: 진행 실패 58건)
                                       # (통로는 경로를 가로지르므로 빠지는 방향은 경로를 따라 뒤다 —
                                       #  옆으로 휘면 명세 이탈 예산 1 m 만 쓴다: 08 실측 0.95 m)
                                       #   (26.6° 비스듬한 교차는 2·R_c/sin 26.6° = 4.97 m). 횡단 각도 하한 22.6°
      recenter_narrow: True            # 좁은 곳(양쪽이 막힌 골) 기준 경로를 지역 코스트맵 골 바닥으로 옮긴다 (dwa.md §1.7):
      recenter_min_cost: 100.0         #   위치추정 편향(전역 경로가 0.60 m 통로 중심에서 2–4 cm 비낌)과 무관하게 실제 통로 중심
      recenter_max_shift: 0.10         # [m] 탐색 폭 = 최대 이동 (0.60 m 통로 측면 여유)
      recenter_smooth: 4               # 이동량 이동평균 반폭 [경로 점] (0.05 m 간격 → ±0.2 m)
      recenter_goal_keep: 0.5          # [m] 목표에서 이 거리 안은 옮기지 않는다
      obstacle_radius: 0.30               # [m] 트랙 덮개 반경 (TrackedObstacle 에 반경 필드가 없어
                                       # 여기서 준다). 0.25 는 추정값이었고 **실제와 5 cm 달랐다** —
                                       # 월드의 사람 액터는 반지름 0.30 (amr_simulation
                                       # dynamic_obstacles.yaml actor_radius), 충돌 감시도 0.30 을
                                       # 쓴다. 그래서 DWA 가 "몸 원통 밖" 이라고 믿는 자리가 실제로는
                                       # 5 cm 안이었다. 08 접촉 4건의 침투가 3.2 / 7.6 / 8.3 / 16.8 mm
                                       # 로 전부 그 오차 안에 들어간다 (j8c t6·t21, reg1 t12·t13).
      track_timeout: 0.5               # [s] 트랙 메시지 유효 시간
      yield_velocity_tau: 0.5          # [s] 통로 예측용 속도의 지수 평활 시간 상수 (0 = 끔).
                                       # VO·TTC 는 원시 속도를 그대로 쓴다 — 즉각 회피를 늦추면
                                       # 안 되기 때문이다. 08 실측: 추적기 진행각이 직선 보행자에
                                       # 대해서도 주기간 90 % 12.6° · 최대 144.9° 흔들린다. 같은
                                       # 로그에 0.5 s 평활을 적용하면 90 % 3.5° · 최대 24.4° 로
                                       # 줄어든다 (1.0 s 는 2.2°/12.9° 지만 실제 방향 전환이
                                       # 1 s 늦는다 — 보행자 회전은 0.5 s 수준이다).
      robot_radius: -1.0               # [m] ≤ 0 이면 풋프린트 외접 반경 (0.361)
      robot_mass: 47.6                 # [kg] 공차 총중량 (payload/mass 가속 스케일 기준)
      allow_unknown: True
      transform_tolerance: 0.2         # [s]
    PurePursuit:
      plugin: "amr_navigation::PurePursuitController"
      desired_linear_vel: 1.0          # [m/s] 순항 속도
      lookahead_time: 0.8              # [s] L = clamp(k·v, L_min, L_max): ω_n = √2/k 로 속도 무관 (path_tracking.md)
      min_lookahead_dist: 0.4          # [m] 저속 하한 (위치추정 잡음 증폭 억제)
      max_lookahead_dist: 1.8          # [m]
      # max_angular_vel / max_angular_accel / max_linear_accel / max_linear_decel / max_linear_jerk 는
      # robot_params.yaml limits.* 가 기본값 (단일 출처)
      max_lateral_accel: 0.8           # [m/s²] 곡률 감속 v ≤ √(a_lat/|κ|) (적재물 안정)
      min_approach_linear_velocity: 0.05
      approach_latency: 0.3            # [s] 목표 정지 접근의 명령→실속도 지연 (DWA 와 같은 근거·튜닝 표)
      curvature_window: 0.25           # [m] 이산 곡률 추정 창
      use_rotate_to_heading: True
      rotate_to_heading_min_angle: 0.785   # [rad] look-ahead 방향 오차가 이보다 크고 거의 정지면 제자리 회전
      rotate_to_heading_max_v: 0.1     # [m/s]
      goal_align_distance: 0.08        # [m]
      goal_yaw_tolerance: 0.02         # [rad]
      use_chord_correction: False      # CC-PP 확장 (브리프 path-tracking §4.1). 이상 플랜트에서는 곡선 CTE 1.74 → 0.24 cm 이나
                                       # 실제 체인(프로파일러 + 서보 지연, tracking_sim)에서는 이득 없음 (U 턴 0.4 vs 0.6 cm)
                                       # → 기본 PP 사용, 옵션으로 유지 (path_tracking.md §1.5)
      chord_gain: 1.0
      use_collision_detection: True
      collision_check_time: 1.0        # [s] 명령 원호 충돌 검사 시간 (최소; 제동 시간이 더 길면 그만큼)
      robot_mass: 47.6
      transform_tolerance: 0.2
    DWB:                               # 비교군: Nav2 DWB (TEB 는 Humble 바이너리 없음 → dwa.md)
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.0
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 11
      vy_samples: 1
      vtheta_samples: 31
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    RPP:                               # 비교군: Nav2 Regulated Pure Pursuit (path_tracking.md 비교)
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.8
      lookahead_time: 0.8
      rotate_to_heading_angular_vel: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: True
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: False
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: True
      allow_reversing: False
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: True

costmap_scan_filter_node:            # scan_filtered → 게이트 중앙값 → scan_costmap (두 코스트맵의 LiDAR 입력, costmap.md §3)
  ros__parameters:
    use_sim_time: True
    input_topic: scan_filtered
    output_topic: scan_costmap
    half_window: 5                     # ±5 빔 (±2.5°): σ 0.03 → 수직 입사 벽 σ_med ≈ 0.011 m
    range_gate: 0.15                   # [m] 같은 표면 판정 (두 빔 잡음 차 σ√2 의 3.5 배) — 얇은 물체·불연속 보존
    min_support: 3                     # 지지 빔이 이보다 적으면 원래 값 (단발 반사도 장애물로 남긴다)
    static_output_topic: scan_costmap_static   # 전역 코스트맵용: 동적 트랙 끝점 제외 (costmap.md §5.2)
    cloud_input_topic: camera/depth/points_filtered
    cloud_output_topic: camera/depth/points_static   # 전역 깊이 레이어용: 동적 트랙 근처 점 제외
    tracks_topic: perception/tracked_obstacles
    exclude_dynamic: True              # 지나가는 사람·차량은 지역 계획기(VO/TTC)가 피하고 전역 경로는 뒤집히지 않게
    # 명세 4.7 "재계획하여 회피" — 제외 대상을 "모든 빠른 동적 트랙" 에서 "**내 경로와
    # 만나지 않을** 빠른 동적 트랙" 으로 좁힌다. TTC 가 유한하고 이 값 이하면 경로 위에서
    # 실제로 만난다는 뜻이므로 전역에서 지우지 않고, 그 트랙의 **예측 점유**를
    # perception/predicted_obstacles 로 낸다 (전역 depth_layer 의 predicted 소스).
    # 0 이면 끔(종전 거동).
    #
    # 임계 유도: 재계획 파이프라인 지연이 코스트맵 0.2 s + BT 1.0 s + A* 0.013 s = 1.21 s 다.
    # 예측 점유가 경로를 덮는 시점보다 그만큼 앞서 재진입해야 하므로 여유를 두고 2.5 s.
    # predict_horizon 2.0 s 는 그 예측이 경로를 실제로 가로지르기에 충분해야 한다 —
    # 보행자 1.0 m/s 면 2.0 m 를 쓸고 지나가고, 차단 반경 0.611 m 의 3 배 이상이다.
    # **기본 2.5 = 켬.** 구현·동작이 확인됐고 (대조군 대비 재계획 5 % -> 22 %,
    # Fisher p = 0.0136, logs/OFF1a·b vs RP3a·b), 이를 끄게 만들었던 "이탈·복귀 단조 악화"
    # 는 **측정 결함이었다**.
    #
    # 앞서 이 자리에 적었던 표(끔 0/60 -> 차단창0.15 5/60 초과)는 시나리오 08 하네스가
    # 이탈을 **시행의 첫 계획 하나**에 대해 잰 값이다. 재계획하면 로봇은 새 경로를 따르는데
    # 거리는 버려진 옛 경로와 재므로, 명세 181행이 지시한 회피 수단 자체가 이탈로 집계된다.
    # 하네스를 "그 시각 유효한 계획" 기준으로 고치고 같은 로그를 다시 채점한 결과
    # (재계획 켠 7 팔 x 30 = 210 시행):
    #   기준            이탈>1.0   복귀>5
    #   첫 계획(옛)      16/210     8/210
    #   현재 경로(맞음)   2/210     1/210
    # RP3a·RP3b(이 설정 그대로 + 재계획)는 두 기준 중 옳은 쪽에서 0 건·0 건이다.
    # 지표가 관대해진 것이 아니다 — 같은 수정이 x8b t04 를 0.530 -> 1.177 로 **올린다**
    # (따르던 경로에서 실제로 벗어난 것을 옛 기준이 감췄다).
    admit_ttc: 2.5
    admit_release_s: 1.0               # 재진입 유지 창 (TTC 가 잠깐 튀어도 마킹이 떨지 않게)
    # [s] 예측을 찍을 수 있는 상한. TTC 창만 표본하므로 키워도 점 수가 늘지 않는다.
    # admit_ttc + predict_window (2.5 + 0.4) 을 덮어야 재진입한 트랙의 만남 지점이
    # 잘리지 않는다 — 계약 test_admit_ttc_leaves_time_to_replan 이 고정한다.
    predict_horizon: 3.0
    predict_dt: 0.25                   # [s] 시간 표본 간격 (2.0/0.25 = 8 표본 x 둘레 8 점)
    predict_z: 0.30                    # [m] 점 높이 (전역 depth_layer 창 0.05~2.0 안)
    # [s] TTC 둘레 창 반폭. 쓸고 지나갈 복도 전체(2 s x 1 m/s = 2 m)를 치명 마킹하면 A* 가
    # 통째로 돌아가 이탈이 명세 1 m 를 넘는다 (실측 RP2a 2.75 m). 보행자는 곧 사라지는데
    # 2D 마킹은 그것을 표현할 수 없으므로, 로봇이 실제로 그 자리에 도달하는 시각(TTC)
    # 앞뒤만 좁게 찍는다. 0.4 s x 1.0 m/s = 0.8 m 로 차단 반경 0.611 m 를 겨우 덮는다.
    # 0.15 s = 0.3 m 로 좁힌다 — 로봇 내접원(0.20) 수준이라 A* 가 **살짝** 비켜가는 경로를 낸다.
    # 주의: 여기 있던 "0.4 면 이탈이 명세를 넘는다 (RP3a·b 3/13)" 는 근거를 지웠다. 그 수치는
    # 첫 계획 기준으로 잰 값이고, 현재 경로 기준으로 다시 채점하면 창 0.4 짜리 RP2a 도 초과
    # 0/30 이다 (admit_ttc 주석 참조). 0.15 를 유지하는 근거는 이제 실측 우열이 아니라
    # "치명 마킹은 필요한 만큼만" 이라는 보수적 선택이며, 0.4 와의 비교는 재측정 대상이다.
    predict_window: 0.15
    dynamic_min_speed: 0.2             # [m/s] DWA dynamic_speed_threshold 와 같게
    dynamic_fast_speed: 0.5            # [m/s] is_dynamic 분류 전이라도 이 속도 이상이면 동적 (분류 지연·ID 교체 대비)
    dynamic_radius: 0.55               # [m] 트랙 중심 반경: 사람 발자국 0.30 + 추적 위치 오차(실측 0.1–0.25)
    track_timeout: 0.5                 # [s]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0           # [Hz] = LiDAR 10 Hz (동적 장애물 반영 주기)
      publish_frequency: 2.0
      global_frame: <prefix>odom
      robot_base_frame: <prefix>base_footprint
      rolling_window: True
      width: 8                         # [m] 반폭 4 m ≥ DWA 롤아웃 최대 2.5 s × 1.0 m/s + 풋프린트 (costmap.md §1)
      height: 8
      resolution: 0.025                # [m] 0.60 m 통로 측면 여유 0.10 m 에서 격자 양자화 손실을 셀 하나(≤ 0.025)로 (costmap.md §3)
      footprint: "[[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]"   # robot_params 0.60 x 0.40
      footprint_padding: 0.0           # 패딩 0.01 이면 r_ins 0.21 → 0.60 m 통로 중앙 비용 상승 (costmap.md)
      track_unknown_space: False
      always_send_full_costmap: True
      plugins: ["obstacle_layer", "depth_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0       # [m] 레이어 상한 (소스 창보다 넓게)
        observation_sources: scan
        scan:
          topic: <robot_ns>/scan_costmap   # costmap_scan_filter_node 출력 = scan_filtered 의 게이트 중앙값 (위 주의: 절대 이름으로 치환)
          data_type: "LaserScan"
          marking: True
          clearing: True
          # 높이 창 [m]: 점은 odom 에서 lidar_link 높이(지면 +0.20 = base_link 0.18 + extrinsic 0.02)에 온다.
          # Humble 의 소스별 max_obstacle_height 기본값은 0.0 이라 적지 않으면 모든 점이 버려진다 (리뷰 실측:
          # 랙 옆 costmap 전 셀 0). test/test_costmap_config.py 가 이 창이 센서 평면을 담는지 검사한다.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0 # [s] 최신 스캔만 사용 → 지나간 동적 장애물 셀은 다음 스캔 레이트레이싱으로 즉시 지움
          expected_update_rate: 0.3    # [s] = safety.sensor_timeouts.lidar. 넘으면 코스트맵 비최신 → 제어 정지 (LiDAR 고장 = 안전 정지)
          obstacle_max_range: 5.5      # [m] 창 대각 반폭 5.7 m 안
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0      # [m] 마킹보다 길게 → 창 가장자리의 지난 셀도 지운다
          raytrace_min_range: 0.0
          inf_is_valid: False
      depth_layer:                     # 깊이 카메라: LiDAR 평면(지면 +0.20) 아래 물체 (소형 박스 0.15, 지게차 포크 0.05~0.10)
        # 2D 장애물 레이어 (VoxelLayer 아님): 복셀은 3D 광선이 지나간 복셀만 지우는데 바닥 점은 높이 창에서 빠져
        # 광선이 없으므로, 지나간 사람의 몸통 복셀이 남는다 (실측: 횡단 actor 궤적에 잔상 셀 평균 128, 최대 490 —
        # costmap.md §5). 2D 레이어는 바닥 점까지의 광선이 그 열(column) 전체를 지운다.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: depth_mark depth_clear
        depth_mark:                    # 마킹 전용: 바닥 위 min_obstacle_height 이상 점
          topic: <robot_ns>/camera/depth/points_filtered   # pointcloud_filter_node 출력 (5 cm 복셀 다운샘플, 광학 프레임)
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.05    # [m] 바닥 점 제거. 실측 바닥 점 높이 분포는 costmap.md §5.1
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.0    # 카메라 고장은 저속 운행(safety degraded_mode) 대상 → 코스트맵 최신성 판정에서 제외
          obstacle_max_range: 4.0      # [m] 깊이 잡음 σ ∝ d² (sensors.yaml) → 4 m 이내만 마킹
        depth_clear:                   # 소거 전용: 바닥 점 포함 (카메라 → 바닥 점 광선이 지나간 사람·박스 셀을 지운다)
          topic: <robot_ns>/camera/depth/points_filtered
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.50
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0       # [1/m] 지역: 가파른 감쇠 → 통로 중앙 186, DWA 여유 비용이 벽 근처에서만 작동
        inflation_radius: 0.8          # [m] 2 m/s 정지거리 이상은 여유 비용이 아닌 충돌 검사·속도 제한이 담당

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0            # [Hz] 전역 재계획 1 Hz 보다 충분히 빠르게
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: <prefix>base_footprint
      resolution: 0.05
      footprint: "[[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]"
      footprint_padding: 0.0
      track_unknown_space: True
      always_send_full_costmap: True
      # 팽창 두 번: 정적 지도는 넓게(1.2 m, A* 가 넓은 통로 선호), 센서 장애물(사람·지게차·박스)은 그 뒤에 좁게(0.6 m) —
      # 지나가는 사람을 1.2 m 로 팽창하면 1 Hz·TTC 재계획이 1 m 넘게 돌아가 복귀가 늦다 (횡단 actor 실측, costmap.md §5.2).
      # 두 번째 팽창도 정적 셀을 다시 팽창하지만 값이 더 작아 max 결합에서 첫 번째가 남는다.
      plugins: ["static_layer", "inflation_layer", "obstacle_layer", "depth_layer", "predicted_layer", "sensor_inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map                # 공유 지도 (multi_robot.md: map 프레임·토픽은 하나)
        trinary_costmap: True          # 1…252 값은 inflation 에서만 → 비용↔거리 역함수 성립 (astar.md)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: <robot_ns>/scan_costmap_static   # 동적 트랙 끝점 제외본 (지나가는 사람은 지역 계획기가)
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: 0.0     # [m] 지역과 같은 창 (LiDAR 평면 +0.20)
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.3
          obstacle_max_range: 8.0      # [m] 전역 재계획에 반영할 새 장애물 범위
          raytrace_max_range: 10.0
          inf_is_valid: False
      depth_layer:                     # LiDAR 평면 아래 장애물을 전역 재계획에도 (지역 depth_layer 와 같은 두 소스)
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: <robot_ns>/camera/depth/points_static
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          obstacle_max_range: 4.0
        depth_clear:
          topic: <robot_ns>/camera/depth/points_static
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.50
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          raytrace_max_range: 5.0
      inflation_layer:                 # 정적 지도만 (센서 레이어보다 앞)
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0       # [1/m] 완만한 감쇠: 넓은 통로에서는 중앙으로, 0.60 m 통로 중앙은 206 (통과)
        inflation_radius: 1.2          # [m] 비용이 34 까지 내려가는 거리 — A* 가 좁은 통로보다 넓은 통로를 선호
      predicted_layer:                 # 명세 4.7 "재계획하여 회피" / 9장 "예측 기반 회피"
        # costmap_scan_filter_node 가 **계획 충돌 트랙**(TTC 유한·admit_ttc 이하, 그리고 그
        # TTC 가 경로 모형으로 계산된 스캔에서만)이 로봇과 만나는 시점의 점유를 낸다.
        # 지나가는 사람은 TTC = inf 라 안 들어온다 = 전역 경로 요동은 그대로 막힌다.
        # **전역에만** 넣는다 — 지역 회피는 종전대로 DWA 의 VO/TTC 가 한다.
        #
        # ObstacleLayer 가 아니라 전용 레이어인 이유: ObstacleLayer 는 항상 LETHAL(254) 로
        # 찍어 A* 가 **벽**으로 본다. 실측(logs/RP3a·b 60 시행) 재계획한 시행 이탈 중앙
        # 0.574 m vs 안 한 시행 0.162 m 이고 명세 1.0 초과가 재계획한 시행에서만 3/13,
        # 대조군(60 시행)은 0/60 이었다. 그 자리는 벽이 아니라 **곧 비워질 자리**이므로
        # 막지 않고 기피한다.
        plugin: "amr_navigation::PredictedObstacleLayer"
        enabled: True
        topic: <robot_ns>/perception/predicted_obstacles
        # 실측이 둘 다 필요함을 보였다:
        #   229(기피) — A* 가 그냥 통과해 재계획이 22 % -> 7 % 로 죽었다 (logs/CB1a·b)
        #   254(차단) — 재계획은 22 % 로 살지만 우회가 커 이탈이 넘었다 (logs/RP3a·b)
        # 차단을 쓰되 창을 좁혀(predict_window) 우회를 제한하는 쪽을 택한다.
        cost: 254.0
        radius: 0.30                   # [m] 점마다 채우는 반경 (보행자 반경 0.25 + 여유)
        timeout: 0.5                   # [s] 이보다 오래된 구름은 쓰지 않는다 (발행 멈추면 만료)
        # [m] **로봇 자기 자리에는 치명을 찍지 않는다.** 찍으면 A* start 가 막히고
        # (astar.cpp 의 start 탈출 예외가 kLethalObstacle 을 제외한다) BT 가 follow_path 를
        # 취소해 제어 주기가 통째로 빈다. 실측: cost 254 를 쓴 4 실행에서만
        # "AStarPlanner: start blocked" 가 나오고 나머지 164 실행은 0 건이며, 그 실행들의
        # 접촉 6 건 중 **4 건이 1.6~6.4 s 짜리 제어 공백 안**에서 났다 (연구 브리프 §11).
        # 그 자리는 cost 229(기피)로 강등한다 — 계획기는 통과하고 기피는 유지된다.
        # 실제 안전은 안전 게이트(STOP 래치)가 맡는다. 0 으로 두면 종전 거동.
        # 외접원 0.361 + 여유 0.10. 계약 KeepoutCoversTheRobotFootprintCircle 이 고정한다.
        lethal_keepout: 0.46
      sensor_inflation_layer:          # 센서 장애물 (정적 셀에는 첫 팽창이 이미 더 큰 값)
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0       # [1/m] r_ins 0.2 에서 253, 0.36 m(외접) 113, 0.6 m 34
        inflation_radius: 0.6          # [m]
      pedestrian_lane_filter:          # 보행 차선 기피 (전역 계획만 — 지역은 막지 않는다)
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        # localization.launch.py 의 pedestrian_lane_mask_server + filter_info_server 가 발행한다
        # (절대 이름: Nav2 코스트맵 노드 네임스페이스에서 상대 이름이 풀리면
        #  /amr_01/global_costmap/... 이 된다 — keepout_filter 와 같은 규약).
        # 마스크 점유 90 → 비용 231. 치명(254)·외접(253) 미만이라 통행은 되고 A* 가 기피만 한다.
        # 근거: 실측 A→B 계획 9.00 m 중 8.49 m (94 %) 가 보행 차선 몸 원통 안이었고 차선 밖
        # 연속 구간이 0.25 m 뿐이라, 움직이면 회피 이득에 밀려 이탈하고 멈추면 밟혔다
        # (07 CTE 0.1696 · 08 접촉 9/60). 띠를 넣으면 노출 94 % → 51 %, 차선 밖 연속 구간
        # 0.25 m → 4.64 m, 경로 9.40 → 10.91 m (+16 %). 마스크 파일이 없으면 런치가 서버를
        # 띄우지 않고, 이 필터는 정보 토픽을 못 받아 조용히 비활성이 된다.
        filter_info_topic: /pedestrian_lane_filter_info
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: <robot_ns>/costmap_filter_info   # traffic_manager_node 발행 (이진 마스크 0/100 → 0/254)

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: <prefix>odom
    robot_base_frame: <prefix>base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: <prefix>base_footprint
    odom_topic: odometry/filtered
    bt_loop_duration: 10               # [ms]
    default_server_timeout: 20         # [ms]
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml / plugin_lib_names 는 런치가 넣는다
    # (amr_behavior 설치 여부에 따라 TTC 조건 포함판 또는 대체판)

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    bond_timeout: 4.0
    node_names: ["planner_server", "controller_server", "behavior_server", "bt_navigator"]
